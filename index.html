<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#EEF3F8">
<meta name="description" content="Dziennik żywienia i treningu dla pływaka. Rozpoznawanie posiłków ze zdjęcia działa lokalnie na urządzeniu — bez chmury i bez konta.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tor">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/core/store.js">
<link rel="modulepreload" href="js/data/foods.js">

<title>Tor — dziennik pływaka</title>
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="grow" style="min-width:0">
      <button id="headerBack" class="chip chip-tap chip-blue hidden" style="margin-bottom:6px">
        ← Wróć do dzisiaj
      </button>
      <h1 id="hTitle">Dzisiaj</h1>
      <div class="sub" id="hDate"></div>
    </div>
    <button class="avatar" id="avatarBtn" aria-label="Profil i ustawienia">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="15.8" cy="6.2" r="2.1"/>
        <path d="M3.5 12.4l3.6-2.7 3.8 1.9 3.2-2.8"/>
        <path d="M2 17.6c2.5-2.1 4.2-2.1 6.7 0s4.2 2.1 6.7 0 4.2-2.1 6.6 0"/>
      </svg>
    </button>
  </header>

  <main id="viewHost">
    <!-- Placeholder shown until the first render; keeps the shell from flashing. -->
    <div class="glass" style="padding:26px;text-align:center">
      <div class="skeleton" style="height:200px;border-radius:22px;margin-bottom:16px"></div>
      <div class="skeleton" style="height:14px;width:70%;margin:0 auto 10px"></div>
      <div class="skeleton" style="height:14px;width:45%;margin:0 auto"></div>
    </div>
  </main>
</div>

<div class="fab-bar" id="fabBar">
  <button class="btn btn-primary" data-action="capture:photo">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 8.6h2.4l1.4-2.2h8.4l1.4 2.2H20a1.6 1.6 0 0 1 1.6 1.6v7.4A1.6 1.6 0 0 1 20 19.4H4a1.6 1.6 0 0 1-1.6-1.6v-7.4A1.6 1.6 0 0 1 4 8.6Z"/>
      <circle cx="12" cy="13.6" r="3.4"/>
    </svg>
    Zdjęcie posiłku
  </button>
  <button class="glass fab-round" data-action="capture:gallery" aria-label="Wybierz zdjęcie z galerii" style="border-radius:50%">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3.2" y="5.2" width="17.6" height="13.6" rx="4"/>
      <circle cx="9" cy="10" r="1.6"/>
      <path d="M4 16.4l4.2-3.4 3.4 2.6 3-2.4 5.4 4"/>
    </svg>
  </button>
  <button class="glass fab-round" data-action="meal:search" aria-label="Dodaj posiłek bez zdjęcia — wpisz ręcznie" style="border-radius:50%">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20h4.2L19.4 8.8a2 2 0 0 0 0-2.8l-1.4-1.4a2 2 0 0 0-2.8 0L4 15.8V20Z"/>
      <path d="M14.5 6.5l3 3"/>
    </svg>
  </button>
</div>

<nav class="tabbar glass" id="tabbar" role="tablist" aria-label="Nawigacja główna">
  <button role="tab" data-tab="day" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 16c2.4-2 4-2 6 0s3.6 2 6 0 4-2 6 0"/><path d="M2 20.5c2.4-2 4-2 6 0s3.6 2 6 0 4-2 6 0"/><circle cx="15.5" cy="5" r="1.9"/><path d="M5.5 12l3.5-2.6 3.6 1.8 3-2.7"/></svg>
    Dzisiaj
  </button>
  <button role="tab" data-tab="training" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
    Trening
  </button>
  <button role="tab" data-tab="micro" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v5.5"/><circle cx="12" cy="14" r="6"/><path d="M9.5 3.5h5"/></svg>
    Mikro
  </button>
  <button role="tab" data-tab="history" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Historia
  </button>
  <button role="tab" data-tab="me" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c1.6-4 4.2-5.6 7.2-5.6S17.6 16 19.2 20"/></svg>
    Ty
  </button>
</nav>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel">
  <div id="sheetBody"></div>
</div>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<noscript>
  <div style="max-width:420px;margin:60px auto;padding:24px;text-align:center;font-family:system-ui">
    <h2>Tor wymaga JavaScriptu</h2>
    <p style="color:#77828D">Cała analiza posiłków dzieje się w przeglądarce — bez JavaScriptu nie ma jak jej uruchomić.</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
